<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta – MyRaven</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="hdr"></header>

<main class="wrap">
  <h1 id="ttl">Mi cuenta</h1>
  <div id="vista" style="margin-top:24px"><p class="msg">Cargando…</p></div>
</main>

<footer id="ftr"></footer>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const VOLVER = new URLSearchParams(location.search).get("volver")==="carrito";

async function init(){
  montarCabecera(); montarPie();
  const s=getSes();
  if(s){
    const j=await api("perfil",{token:s.token});
    if(j.ok){ setSes(Object.assign({},s,j.usuario)); return vistaCuenta(j); }
    if(j.error==="sesion"||j.error==="credenciales") clearSes();
    else if(j.error==="red"){ return $("vista").replaceChildren(el("p",{class:"msg"},msgError(j))); }
  }
  vistaAcceso();
}

function vistaAcceso(){
  $("ttl").textContent="Mi cuenta";
  const v=$("vista"); v.replaceChildren();
  const box=el("div",{class:"narrow"});
  if(!CONFIG.ORDERS_URL) box.append(el("p",{class:"box"},"Las cuentas estarán disponibles cuando se conecte el sistema de pedidos. Mientras tanto puedes comprar sin cuenta."));
  const tabs=el("div",{class:"tabs",role:"tablist"});
  const bL=el("button",{type:"button",role:"tab","aria-selected":"true"},"Iniciar sesión");
  const bR=el("button",{type:"button",role:"tab","aria-selected":"false"},"Crear cuenta");
  tabs.append(bL,bR);
  const fL=formLogin(), fR=formRegistro(); fR.hidden=true;
  const sel=l=>{bL.setAttribute("aria-selected",l);bR.setAttribute("aria-selected",!l);fL.hidden=!l;fR.hidden=l};
  bL.onclick=()=>sel(true); bR.onclick=()=>sel(false);
  box.append(tabs,fL,fR,el("p",{class:"mu",style:"font-size:14px;margin-top:22px"},"¿Solo quieres saber cómo va tu pedido? No necesitas cuenta: usa ",el("a",{href:"seguimiento.html"},"Seguimiento")," con tu código y teléfono."));
  v.append(box);
}

function terminar(j){
  setSes({token:j.token,nombre:j.usuario.nombre,email:j.usuario.email,telefono:j.usuario.telefono});
  location.href = VOLVER ? "carrito.html" : "cuenta.html";
}

function formLogin(){
  const f=el("form",{class:"fm"},
    el("label",{},"Correo",el("input",{name:"email",type:"email",required:"",maxlength:"120",autocomplete:"username"})),
    el("label",{},"Contraseña",el("input",{name:"clave",type:"password",required:"",maxlength:"100",autocomplete:"current-password"})),
    el("button",{class:"btn fill",type:"submit"},"Entrar"),
    el("p",{class:"err",role:"alert"}),
    el("p",{class:"mu",style:"font-size:13px;margin:0"},"¿Olvidaste tu contraseña? Escríbenos por ",el("a",{href:CONFIG.INSTAGRAM_DM,target:"_blank",rel:"noopener"},"Instagram")," y la restablecemos."));
  f.addEventListener("submit",async e=>{
    e.preventDefault(); const er=f.querySelector(".err"), b=f.querySelector("button"); b.disabled=true; er.textContent="Entrando…";
    const j=await api("login",{email:f.email.value.trim(),clave:f.clave.value});
    if(j.ok) return terminar(j);
    er.textContent=msgError(j); b.disabled=false;
  });
  return f;
}

function formRegistro(){
  const f=el("form",{class:"fm"},
    el("label",{},"Nombre",el("input",{name:"nombre",required:"",maxlength:"80",autocomplete:"name"})),
    el("label",{},"Teléfono (WhatsApp)",el("input",{name:"telefono",type:"tel",required:"",maxlength:"20",autocomplete:"tel",placeholder:"+56 9 1234 5678"})),
    el("label",{},"Correo",el("input",{name:"email",type:"email",required:"",maxlength:"120",autocomplete:"email"})),
    el("label",{},"Contraseña (mínimo 8 caracteres)",el("input",{name:"clave",type:"password",required:"",minlength:"8",maxlength:"100",autocomplete:"new-password"})),
    el("input",{class:"hp",name:"web",tabindex:"-1",autocomplete:"off","aria-hidden":"true"}),
    el("label",{class:"ck"},el("input",{type:"checkbox",required:""}),el("span",{},"Acepto el tratamiento de mis datos según la ",el("a",{href:"privacidad.html",target:"_blank"},"política de privacidad"),".")),
    el("button",{class:"btn fill",type:"submit"},"Crear cuenta"),
    el("p",{class:"err",role:"alert"}));
  f.addEventListener("submit",async e=>{
    e.preventDefault(); if(f.web.value) return;
    const er=f.querySelector(".err"), b=f.querySelector("button"); b.disabled=true; er.textContent="Creando cuenta…";
    const j=await api("registro",{nombre:f.nombre.value.trim(),telefono:f.telefono.value.trim(),email:f.email.value.trim(),clave:f.clave.value,web:f.web.value});
    if(j.ok) return terminar(j);
    er.textContent=msgError(j); b.disabled=false;
  });
  return f;
}

function vistaCuenta(j){
  const u=j.usuario; $("ttl").textContent="Hola, "+(u.nombre||"").split(" ")[0];
  const v=$("vista"); v.replaceChildren();
  v.append(el("p",{class:"mu"},u.email+" · "+u.telefono),
    el("div",{style:"margin:14px 0 30px"},el("button",{class:"btn",type:"button",onclick:()=>{clearSes();location.href="index.html"}},"Cerrar sesión")),
    el("h2",{},"Mis pedidos"));
  if(!j.pedidos.length){ v.append(el("p",{class:"msg"},"Aún no tienes pedidos asociados a tu correo. ",el("a",{href:"index.html#catalogo"},"Ver el catálogo"))); return; }
  const t=el("table",{class:"ped"},el("thead",{},el("tr",{},...["Código","Fecha","Producto","Total","Estado"].map(x=>el("th",{},x)))));
  const tb=el("tbody",{});
  j.pedidos.forEach(p=>tb.append(el("tr",{},el("td",{},el("a",{href:"seguimiento.html?codigo="+encodeURIComponent(p.codigo)},p.codigo)),el("td",{},p.fecha),el("td",{},p.producto),el("td",{},p.total),el("td",{},p.estado))));
  t.append(tb); v.append(el("div",{style:"overflow-x:auto"},t));
}
init();
</script>
</body>
</html>
