<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta – MyRaven</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="redondeo.css">
</head>
<body>
<header id="hdr"></header>

<main class="wrap">
  <h1 id="ttl">Mi cuenta</h1>
  <div id="vista" style="margin-top:24px"><p class="msg">Cargando…</p></div>
</main>

<footer id="ftr"></footer>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const VOLVER = new URLSearchParams(location.search).get("volver")==="carrito";

async function init(){
  montarCabecera(); montarPie();
  const s=getSes();
  if(s){
    const j=await api("perfil",{token:s.token});
    if(j.ok){ setSes(Object.assign({},s,j.usuario)); return vistaCuenta(j); }
    if(j.error==="sesion"||j.error==="credenciales") clearSes();
    else if(j.error==="red"){ return $("vista").replaceChildren(el("p",{class:"msg"},msgError(j))); }
  }
  vistaAcceso();
}

function vistaAcceso(){
  $("ttl").textContent="Mi cuenta";
  const v=$("vista"); v.replaceChildren();
  const box=el("div",{class:"narrow"});
  if(!CONFIG.ORDERS_URL) box.append(el("p",{class:"box"},"Las cuentas estarán disponibles cuando se conecte el sistema de pedidos. Mientras tanto puedes comprar sin cuenta."));
  box.append(el("p",{class:"mu",style:"margin:0 0 18px"},"Ingresa tu correo y te enviamos un código para entrar. Sin contraseñas."));
  const f1=formCorreo(), f2=el("div",{});
  f2.hidden=true;
  const mostrarCodigo=email=>{ f1.hidden=true; f2.hidden=false; f2.replaceChildren(formCodigo(email,()=>{f2.hidden=true;f1.hidden=false;f1.email.focus();})); f2.querySelector("input[name=codigo]").focus(); };
  f1.alEnviar=mostrarCodigo;
  box.append(f1,f2,el("p",{class:"mu",style:"font-size:14px;margin-top:22px"},"¿Solo quieres saber cómo va tu pedido? No necesitas cuenta: usa ",el("a",{href:"seguimiento.html"},"Seguimiento")," con tu código de pedido."));
  v.append(box);
}

function terminar(j){
  setSes({token:j.token,nombre:j.usuario.nombre,email:j.usuario.email,telefono:j.usuario.telefono});
  location.href = VOLVER ? "carrito.html" : "cuenta.html";
}

function formCorreo(){
  const f=el("form",{class:"fm"},
    el("label",{},"Correo",el("input",{name:"email",type:"email",required:"",maxlength:"120",autocomplete:"email",inputmode:"email"})),
    el("input",{class:"hp",name:"hp_trampa",tabindex:"-1",autocomplete:"off","data-lpignore":"true","data-1p-ignore":"true","aria-hidden":"true"}),
    el("button",{class:"btn fill",type:"submit"},"Continuar"),
    el("p",{class:"err",role:"alert"}),
    el("p",{class:"mu",style:"font-size:13px;margin:0"},"Al continuar aceptas el tratamiento de tus datos según la ",el("a",{href:"privacidad.html",target:"_blank"},"política de privacidad"),". Si no tienes cuenta, la creamos automáticamente."));
  f.addEventListener("submit",async e=>{
    e.preventDefault(); if(f.hp_trampa.value) return;
    const er=f.querySelector(".err"), b=f.querySelector("button"), email=f.email.value.trim().toLowerCase();
    b.disabled=true; er.textContent="Enviando código…";
    const j=await api("pedir_codigo",{email,web:f.hp_trampa.value});
    b.disabled=false;
    if(j.ok){ er.textContent=""; return f.alEnviar(email); }
    er.textContent=msgError(j);
  });
  return f;
}

function formCodigo(email,volver){
  const er=el("p",{class:"err",role:"alert"}), info=el("p",{class:"mu",style:"margin:0"},"Enviamos un código de 6 dígitos a ",el("b",{},email),". Revisa también la carpeta de spam. Vale por 10 minutos.");
  const inp=el("input",{name:"codigo",inputmode:"numeric",pattern:"[0-9]*",maxlength:"6",required:"",autocomplete:"one-time-code",placeholder:"000000","aria-label":"Código de 6 dígitos",style:"font-size:26px;letter-spacing:10px;text-align:center"});
  const btn=el("button",{class:"btn fill",type:"submit"},"Entrar");
  const re=el("button",{class:"btn",type:"button"},"Reenviar código");
  const cambiar=el("button",{class:"btn",type:"button",onclick:volver},"Cambiar correo");
  const f=el("form",{class:"fm"},info,el("label",{},"Código",inp),btn,er,el("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},re,cambiar));
  let enviando=false;
  async function verificar(){
    if(enviando) return; const codigo=inp.value.replace(/\D/g,""); if(codigo.length!==6) return;
    enviando=true; btn.disabled=true; er.textContent="Verificando…";
    const j=await api("verificar_codigo",{email,codigo});
    if(j.ok) return terminar(j);
    er.textContent=msgError(j); btn.disabled=false; enviando=false; inp.select();
  }
  inp.addEventListener("input",()=>{ inp.value=inp.value.replace(/\D/g,"").slice(0,6); if(inp.value.length===6) verificar(); });
  f.addEventListener("submit",e=>{ e.preventDefault(); verificar(); });
  let t=0, tm;
  function espera(seg){ t=seg; re.disabled=true; clearInterval(tm); tm=setInterval(()=>{ t--; if(t<=0){ clearInterval(tm); re.disabled=false; re.textContent="Reenviar código"; } else re.textContent="Reenviar en "+t+" s"; },1000); re.textContent="Reenviar en "+t+" s"; }
  re.onclick=async()=>{ re.disabled=true; er.textContent="Reenviando…"; const j=await api("pedir_codigo",{email}); if(j.ok){ er.textContent="Te enviamos un código nuevo."; inp.value=""; espera(30); } else { er.textContent=msgError(j); re.disabled=false; } };
  espera(30);
  return f;
}

function formDatos(u){
  const f=el("form",{class:"fm narrow",style:"margin:18px 0 8px"},
    el("h2",{style:"margin:0"},"Tus datos"),
    el("p",{class:"mu",style:"margin:0;font-size:14px"},"Guárdalos una vez y los usamos para completar tus compras más rápido."),
    el("label",{},"Nombre",el("input",{name:"nombre",required:"",maxlength:"80",autocomplete:"name",value:u.nombre||""})),
    el("label",{},"Teléfono (WhatsApp)",el("input",{name:"telefono",type:"tel",required:"",maxlength:"20",autocomplete:"tel",placeholder:"+56 9 1234 5678",value:u.telefono||""})),
    el("button",{class:"btn fill",type:"submit"},"Guardar"),
    el("p",{class:"err",role:"alert"}));
  f.addEventListener("submit",async e=>{
    e.preventDefault(); const er=f.querySelector(".err"), b=f.querySelector("button"), s=getSes(); b.disabled=true; er.textContent="Guardando…";
    const j=await api("perfil_guardar",{token:s&&s.token,nombre:f.nombre.value.trim(),telefono:f.telefono.value.trim()});
    if(j.ok){ setSes(Object.assign({},s,j.usuario)); location.reload(); return; }
    er.textContent=msgError(j); b.disabled=false;
  });
  return f;
}

function vistaCuenta(j){
  const u=j.usuario; $("ttl").textContent=u.nombre?"Hola, "+u.nombre.split(" ")[0]:"Mi cuenta";
  const v=$("vista"); v.replaceChildren();
  v.append(el("p",{class:"mu"},[u.email,u.telefono].filter(Boolean).join(" · ")),
    (!u.nombre||!u.telefono)?formDatos(u):null,
    el("div",{style:"margin:14px 0 30px"},el("button",{class:"btn",type:"button",onclick:()=>{clearSes();location.href="index.html"}},"Cerrar sesión")),
    el("h2",{},"Mis pedidos"));
  if(!j.pedidos.length){ v.append(el("p",{class:"msg"},"Aún no tienes pedidos asociados a tu correo. ",el("a",{href:"index.html#catalogo"},"Ver el catálogo"))); return; }
  const t=el("table",{class:"ped"},el("thead",{},el("tr",{},...["Código","Fecha","Producto","Total","Estado"].map(x=>el("th",{},x)))));
  const tb=el("tbody",{});
  j.pedidos.forEach(p=>tb.append(el("tr",{},el("td",{},el("a",{href:"seguimiento.html?codigo="+encodeURIComponent(p.codigo)},p.codigo)),el("td",{},p.fecha),el("td",{},p.producto),el("td",{},p.total),el("td",{},p.estado))));
  t.append(tb); v.append(el("div",{style:"overflow-x:auto"},t));
}
init();
</script>
</body>
</html>
